name: Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget software-properties-common
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y ninja-build cmake g++-12 llvm-18-dev libfmt-dev libgtest-dev libcurl4-openssl-dev libedit-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run Tests
        run: |
          ./build/bin/mifast test
          ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-gtest

      - name: Configure & Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_MANIFEST_FEATURES=
          cmake --build build --parallel $(nproc)

      - name: Run Tests
        shell: msys2 {0}
        run: |
          ./build/bin/mifast.exe test
          ctest --test-dir build --output-on-failure

  build-windows-vm-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-gtest

      - name: Configure & Build (VM-only)
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMANIFAST_ENABLE_LLVM=OFF
          cmake --build build --parallel $(nproc)

      - name: Run Tests
        shell: msys2 {0}
        run: |
          ./build/bin/mifast.exe test
          ctest --test-dir build --output-on-failure

  # Rebuild playground WASM and fail if docs assets are stale vs a fresh build
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build WASM
        run: |
          emcmake cmake -G Ninja -S src/wasm -B build-wasm
          cmake --build build-wasm --target manifast

      - name: Verify docs assets exist
        run: |
          test -f docs/manifast.js
          test -f docs/manifast.wasm
          test -f docs/index.html
          ls -la docs/manifast.js docs/manifast.wasm

      - name: Upload playground artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manifast-playground-wasm
          path: |
            docs/manifast.js
            docs/manifast.wasm
            docs/index.html
