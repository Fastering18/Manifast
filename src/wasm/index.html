<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c1017">
    <title>Manifast Playground | Indonesian-Syntax Language</title>
    <meta name="description"
        content="Run Manifast in your browser — general-purpose & embeddable language with Indonesian-inspired syntax, powered by a WebAssembly VM.">
    <meta name="keywords" content="Manifast, WASM, playground, Indonesian programming language, embeddable">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fastering.thedev.id/Manifast/">
    <meta property="og:title" content="Manifast Playground">
    <meta property="og:description" content="High-performance coding with Indonesian syntax — try it in your browser.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/one-dark.min.css">
    <style>
        :root {
            --bg-deep: hsl(222, 25%, 6%);
            --bg-surface: hsl(222, 25%, 10%);
            --bg-elevated: hsl(222, 22%, 13%);
            --bg-glass: rgba(22, 27, 34, 0.75);
            --text-primary: hsl(210, 40%, 98%);
            --text-secondary: hsl(210, 16%, 68%);
            --accent: hsl(212, 100%, 65%);
            --accent-glow: hsla(212, 100%, 65%, 0.28);
            --border: hsl(215, 18%, 22%);
            --border-light: hsla(215, 20%, 35%, 0.45);
            --success: hsl(142, 70%, 50%);
            --error: hsl(0, 84%, 60%);
            --warning: hsl(38, 92%, 50%);
            --sidebar-w: clamp(200px, 22vw, 280px);
            --header-h: 56px;
            --console-h: clamp(160px, 32vh, 360px);
            --radius: 8px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            padding:
                var(--safe-top)
                var(--safe-right)
                var(--safe-bottom)
                var(--safe-left);
        }

        header {
            min-height: var(--header-h);
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.5rem clamp(0.75rem, 2vw, 1.5rem);
            z-index: 40;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }

        .logo-text {
            font-weight: 800;
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .version-badge {
            font-size: 0.65rem;
            background: var(--bg-surface);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 99px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        .pulse-dot.warn { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .pulse-dot.err { background: var(--error); box-shadow: 0 0 8px var(--error); animation: none; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.95); opacity: 0.75; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .workspace {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
        }

        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
            z-index: 30;
        }

        .sidebar-header {
            padding: 0.85rem 1rem;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .example-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            -webkit-overflow-scrolling: touch;
        }

        .example-group-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            opacity: 0.7;
            padding: 0.65rem 0.75rem 0.25rem;
            font-weight: 700;
        }

        .example-item {
            padding: 0.55rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.84rem;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-left: 3px solid transparent;
            user-select: none;
        }

        .example-item:hover,
        .example-item:focus-visible {
            background: hsla(212, 100%, 65%, 0.1);
            color: var(--accent);
            outline: none;
        }

        .example-item.active {
            background: hsla(212, 100%, 65%, 0.15);
            color: var(--text-primary);
            font-weight: 600;
            border-left-color: var(--accent);
        }

        .main-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .pane-header {
            padding: 0.4rem clamp(0.75rem, 2vw, 1rem);
            background: var(--bg-deep);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        #editor-container {
            flex: 1;
            min-height: 120px;
            overflow: hidden;
            background: var(--bg-deep);
        }

        .console-area {
            height: var(--console-h);
            min-height: 120px;
            max-height: 70vh;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: #05070b;
            flex-shrink: 0;
            resize: vertical;
            overflow: auto;
        }

        #output {
            flex: 1;
            padding: clamp(0.75rem, 2vw, 1rem);
            font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
            font-size: clamp(12px, 1.6vw, 13.5px);
            line-height: 1.55;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #d1d5db;
            -webkit-overflow-scrolling: touch;
        }

        #output img {
            display: block;
            max-width: min(100%, 720px);
            width: 100%;
            height: auto;
            border-radius: var(--radius);
            margin: 0.75rem 0;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            background: #111;
        }

        #output .err {
            color: var(--error);
        }

        #output .meta {
            color: hsla(200, 100%, 70%, 0.85);
        }

        .btn {
            background: var(--accent);
            color: var(--bg-deep);
            border: none;
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            min-height: 36px;
        }

        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-stop { background: var(--error); display: none; }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text-primary); border-color: var(--text-secondary); background: var(--bg-elevated); box-shadow: none; }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-icon:hover { color: var(--text-primary); background: var(--bg-elevated); }

        .btn-sm {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 3px 8px;
            font-size: 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            min-height: 28px;
        }
        .btn-sm:hover { color: var(--text-primary); background: var(--bg-surface); }

        .shortcut-hint {
            font-size: 10px;
            color: var(--text-secondary);
            opacity: 0.55;
        }

        #timing {
            color: var(--accent);
            font-weight: 500;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
        }

        .cm-s-one-dark .cm-keyword { color: #c678dd; font-weight: bold; }
        .cm-s-one-dark .cm-string { color: #98c379; }
        .cm-s-one-dark .cm-builtin { color: #61afef; }
        .cm-s-one-dark .cm-number { color: #d19a66; }
        .cm-s-one-dark .cm-comment { color: #5c6370; font-style: italic; }
        .cm-s-one-dark .cm-operator { color: #56b6c2; }
        .cm-s-one-dark .CodeMirror-cursor { border-left: 2px solid var(--accent) !important; }

        .CodeMirror {
            height: 100% !important;
            font-family: "JetBrains Mono", ui-monospace, Consolas, monospace !important;
            font-size: clamp(13px, 1.8vw, 14.5px);
            background: transparent !important;
            color: white !important;
        }
        .CodeMirror-gutters {
            background: var(--bg-deep) !important;
            border-right: 1px solid var(--border) !important;
        }

        .loader {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.4s ease;
            padding: 1rem;
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader p {
            margin-top: 1.25rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 25;
        }

        /* Mobile / tablet */
        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                top: calc(var(--header-h) + var(--safe-top));
                bottom: var(--safe-bottom);
                left: 0;
                width: min(86vw, 300px);
                transform: translateX(-105%);
                transition: transform 0.22s ease;
                box-shadow: 8px 0 32px rgba(0, 0, 0, 0.4);
            }
            body.sidebar-open .sidebar { transform: translateX(0); }
            body.sidebar-open .sidebar-backdrop { display: block; }
            .status-label { display: none; }
            .console-area { height: min(40vh, 280px); }
        }

        @media (max-width: 520px) {
            .version-badge, .shortcut-hint { display: none; }
            .btn-run span, .btn-stop span { display: none; }
            header { gap: 0.4rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulse-dot, .spinner { animation: none; }
            .btn, .sidebar { transition: none; }
        }
    </style>
</head>

<body>
    <div id="loader" class="loader" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading Manifast WASM VM…</p>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

    <header>
        <div class="brand">
            <button class="btn-icon" id="btnMenu" type="button" aria-label="Toggle examples" onclick="toggleSidebar()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <span class="logo-text">MANIFAST</span>
            <span class="version-badge">v0.0.13 · playground</span>
        </div>

        <div class="header-actions">
            <div class="status-indicator" title="Runtime status">
                <div class="pulse-dot warn" id="statusDot"></div>
                <span class="status-label" id="statusLabel">Loading</span>
            </div>
            <button class="btn btn-run" id="btnRun" type="button" onclick="runCode()" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <span>Run</span>
            </button>
            <button class="btn btn-stop" id="btnStop" type="button" onclick="stopPlayback()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
                <span>Stop</span>
            </button>
            <span class="shortcut-hint">Ctrl/⌘+Enter</span>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar" id="sidebar" aria-label="Examples">
            <div class="sidebar-header">
                <span>Examples</span>
                <div style="display:flex;gap:4px;">
                    <button class="btn-sm" type="button" onclick="createNewExample()" title="New example">+</button>
                    <button class="btn-sm" type="button" id="btnDeleteExample" onclick="deleteCurrentExample()"
                        title="Delete example" style="display:none;color:var(--error);border-color:var(--error);">–</button>
                </div>
            </div>
            <div class="example-list" id="example-list"></div>
        </aside>

        <div class="main-editor">
            <div class="pane-header">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                    <span id="fileLabel">main.mnf</span>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <span id="timing"></span>
                    <button class="btn-sm" type="button" id="btnCopy" onclick="copyCode()">Copy</button>
                </div>
            </div>
            <div id="editor-container" role="textbox" aria-label="Manifast source editor"></div>

            <div class="console-area" id="consoleArea">
                <div class="pane-header">
                    <span>Output</span>
                    <button class="btn-sm" type="button" onclick="clearOutputView()">Clear</button>
                </div>
                <div id="output" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/mode/simple.min.js"></script>
    <script>
        /* ---------- Syntax mode ---------- */
        CodeMirror.defineSimpleMode("manifast", {
            start: [
                { regex: /--.*/, token: "comment" },
                { regex: /"(?:[^\\]|\\.)*?(?:"|$)/, token: "string" },
                { regex: /'(?:[^\\]|\\.)'/, token: "string" },
                { regex: /\b(?:fungsi|jika|kalau|sebaliknya|kecuali|maka|tutup|kembali|lokal|tetap|untuk|ke|langkah|lakukan|selama|selagi|dan|atau|bukan|kelas|self|impor|benar|salah|nil|coba|tangkap|tipe)\b/, token: "keyword" },
                { regex: /\b(?:i8|i16|i32|i64|u8|u16|u32|u64|f32|f64|angka|char|string|boolean)\b/, token: "builtin" },
                { regex: /\b(?:print|println|tunggu|input|assert|exit|waktuNano|clearOutput|len|sin|cos|tan|sqrt|abs|floor|ceil|pow|log|exp|linspace)\b/, token: "builtin" },
                { regex: /\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b/, token: "number" },
                { regex: /[+\-*/%<>=!&|^]+/, token: "operator" },
            ],
            meta: { lineComment: "--" }
        });

        window.editor = CodeMirror(document.getElementById("editor-container"), {
            value: "-- Loading…",
            mode: "manifast",
            theme: "one-dark",
            lineNumbers: true,
            tabSize: 2,
            indentWithTabs: false,
            lineWrapping: true,
            viewportMargin: Infinity,
            extraKeys: {
                "Ctrl-Enter": () => runCode(),
                "Cmd-Enter": () => runCode()
            }
        });

        /* ---------- Examples (verified against language + WASM runtime) ---------- */
        const defaultExamples = {
            fib: {
                name: "Fibonacci",
                group: "Basics",
                code: `-- Fibonacci (recursive)
lokal os = impor("os")

fungsi fib(n)
  jika n < 2 maka kembali n tutup
  kembali fib(n - 1) + fib(n - 2)
tutup

lokal t0 = os.waktuNano()
lokal h = fib(20)
lokal t1 = os.waktuNano()

println("fib(20) =", h)
println("Waktu:", (t1 - t0) / 1000000, "ms")`
            },
            fizzbuzz: {
                name: "FizzBuzz",
                group: "Basics",
                code: `untuk i = 1 ke 20 lakukan
  jika i % 15 == 0 maka println("FizzBuzz")
  kalau i % 3 == 0 maka println("Fizz")
  kalau i % 5 == 0 maka println("Buzz")
  sebaliknya println(i)
  tutup
tutup`
            },
            plot: {
                name: "Plot Chart",
                group: "Graphics",
                code: `-- Sine wave chart (WASM plot module)
lokal plot = impor("plot")
lokal math = impor("math")

plot.reset()
lokal x = []
lokal y = []

untuk i = 0 ke 64 lakukan
  lokal t = i / 10.0
  x.push(t)
  y.push(math.sin(t))
tutup

plot.line(x, y, {
  title: "Sine Wave",
  xlabel: "x (rad)",
  ylabel: "sin(x)",
  width: 720,
  height: 400
})
plot.show()
println("Plot rendered.")`
            },
            mandelbrot: {
                name: "Mandelbrot Animated",
                group: "Graphics",
                code: `-- ASCII Mandelbrot animation
-- os.clearOutput + os.tunggu(ms) work in the playground
lokal os = impor("os")

fungsi gambar(iterasi)
  os.clearOutput()
  println("Mandelbrot  depth=", iterasi)
  untuk y = 0 ke 22 lakukan
    lokal cy = (y / 22.0) * 2.0 - 1.0
    untuk x = 0 ke 64 lakukan
      lokal cx = (x / 64.0) * 2.5 - 1.75
      lokal zx = 0.0
      lokal zy = 0.0
      lokal i = 0
      selama (zx * zx + zy * zy < 4.0) dan (i < iterasi) lakukan
        lokal t = zx * zx - zy * zy + cx
        zy = 2.0 * zx * zy + cy
        zx = t
        i = i + 1
      tutup
      jika i == iterasi maka print("#") sebaliknya print(".") tutup
    tutup
    println("")
  tutup
tutup

untuk d = 1 ke 18 lakukan
  gambar(d)
  os.tunggu(45)
tutup
println("Done!")`
            },
            ascii_heart: {
                name: "Heart ASCII Art",
                group: "Graphics",
                code: `-- Heart curve (negative for-step supported)
untuk y = 1.5 ke -1.5 langkah -0.1 lakukan
  untuk x = -1.5 ke 1.5 langkah 0.045 lakukan
    lokal a = x * x + y * y - 1.0
    jika a * a * a - x * x * y * y * y <= 0.0 maka
      print("*")
    sebaliknya
      print(" ")
    tutup
  tutup
  println("")
tutup
println("")
println("Manifast <3")`
            },
            newton: {
                name: "Newton-Raphson",
                group: "Math",
                code: `-- Newton-Raphson: x_{n+1} = x_n - f(x_n)/f'(x_n)
tipe fnAngka = fungsi(angka): angka

fungsi nr(xn: angka, f: fnAngka, fd: fnAngka): angka
  kembali xn - f(xn) / fd(xn)
tutup

-- target: y = x^2 + 7x + 6
lokal f = fungsi(x) kembali x * x + 7 * x + 6 tutup
lokal fd = fungsi(x) kembali 2 * x + 7 tutup

println("Finding root (xn starts at 1)")
lokal xn = 1.0
untuk i = 1 ke 8 lakukan
  println(i, xn)
  xn = nr(xn, f, fd)
tutup
println("Final root:", xn)`
            },
            error_calc: {
                name: "Numerical Error",
                group: "Math",
                code: `lokal math = impor("math")

fungsi hitung_error(v_true: angka, v_approx: angka): angka
  jika v_true == 0 maka kembali math.abs(v_approx) tutup
  kembali math.abs((v_true - v_approx) / v_true) * 100
tutup

lokal t = math.pi
lokal a = 3.14
lokal err = hitung_error(t, a)

println("True value:", t)
println("Approx:", a)
println("Relative error:", err, "%")`
            },
            oop: {
                name: "Class & Objects",
                group: "OOP",
                code: `kelas Mobil maka
  fungsi inisiasi(merk, thn)
    self.merk = merk
    self.thn = thn
  tutup

  fungsi info()
    println("Mobil:", self.merk, "(" + self.thn + ")")
  tutup
tutup

lokal m1 = Mobil("Toyota", 2022)
m1.info()`
            }
        };

        const STORAGE_KEY = "manifast_playground_custom_v2";
        let customExamples = {};
        let currentExampleKey = "fib";

        function loadCustom() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) customExamples = JSON.parse(data);
            } catch (e) {
                console.warn("custom examples load failed", e);
            }
        }

        function saveCustom() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(customExamples));
        }

        function allExamples() {
            return { ...defaultExamples, ...customExamples };
        }

        function selectExample(key) {
            currentExampleKey = key;
            const ex = allExamples()[key];
            if (!ex) return;
            window.editor.setValue(ex.code);
            document.getElementById("fileLabel").textContent = (ex.name || key) + ".mnf";
            document.querySelectorAll(".example-item").forEach((el) => {
                el.classList.toggle("active", el.dataset.key === key);
            });
            document.getElementById("btnDeleteExample").style.display =
                key.startsWith("custom_") ? "inline-block" : "none";
            closeSidebar();
            window.editor.refresh();
        }

        function initSidebar() {
            const list = document.getElementById("example-list");
            list.innerHTML = "";
            const all = allExamples();

            const groups = {};
            Object.keys(all).forEach((key) => {
                const g = all[key].group || (key.startsWith("custom_") ? "Yours" : "Examples");
                if (!groups[g]) groups[g] = [];
                groups[g].push(key);
            });

            Object.keys(groups).forEach((g) => {
                const label = document.createElement("div");
                label.className = "example-group-label";
                label.textContent = g;
                list.appendChild(label);

                groups[g].forEach((key) => {
                    const item = document.createElement("div");
                    item.className = "example-item" + (key === currentExampleKey ? " active" : "");
                    item.dataset.key = key;
                    item.tabIndex = 0;
                    item.setAttribute("role", "button");
                    item.innerHTML = `<span>${all[key].name}</span>`;
                    item.onclick = () => selectExample(key);
                    item.onkeydown = (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            selectExample(key);
                        }
                    };
                    list.appendChild(item);
                });
            });
        }

        function createNewExample() {
            const name = prompt("Name for new example:", "Custom Script");
            if (!name) return;
            const key = "custom_" + Date.now();
            customExamples[key] = {
                name,
                group: "Yours",
                code: window.editor.getValue() || "-- Start coding here\nprintln(\"halo\")\n"
            };
            saveCustom();
            initSidebar();
            selectExample(key);
        }

        function deleteCurrentExample() {
            if (!currentExampleKey.startsWith("custom_")) return;
            if (!confirm("Delete this custom example?")) return;
            delete customExamples[currentExampleKey];
            saveCustom();
            initSidebar();
            selectExample("fib");
        }

        /* ---------- Layout helpers ---------- */
        function toggleSidebar() {
            if (window.matchMedia("(max-width: 900px)").matches) {
                document.body.classList.toggle("sidebar-open");
            }
        }
        function closeSidebar() {
            document.body.classList.remove("sidebar-open");
        }
        function clearOutputView() {
            document.getElementById("output").innerHTML = "";
        }

        function setStatus(kind, label) {
            const dot = document.getElementById("statusDot");
            const text = document.getElementById("statusLabel");
            dot.className = "pulse-dot" + (kind === "ok" ? "" : kind === "warn" ? " warn" : " err");
            text.textContent = label;
        }

        /* ---------- Playback engine (async markers) ---------- */
        let playbackId = 0;
        let isRunning = false;

        function setRunning(running) {
            isRunning = running;
            document.getElementById("btnRun").style.display = running ? "none" : "inline-flex";
            document.getElementById("btnStop").style.display = running ? "inline-flex" : "none";
            document.getElementById("btnRun").disabled = running || !window.Module;
        }

        function stopPlayback() {
            playbackId++;
            setRunning(false);
            setStatus("ok", "Stopped");
        }

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function appendText(text, className) {
            if (!text) return;
            const outputEl = document.getElementById("output");
            const span = document.createElement("span");
            if (className) span.className = className;
            span.textContent = text;
            outputEl.appendChild(span);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function appendImage(dataUrl) {
            const outputEl = document.getElementById("output");
            const img = document.createElement("img");
            img.alt = "Manifast plot";
            img.loading = "lazy";
            img.src = dataUrl.startsWith("data:") ? dataUrl : ("data:image/bmp;base64," + dataUrl);
            outputEl.appendChild(img);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        /**
         * Parse WASM runtime markers and play them with real delays.
         * Markers: [CLR]  [DLY:ms]  [IMG:data:...]
         */
        async function playMarkedOutput(raw, runId) {
            const outputEl = document.getElementById("output");
            let pos = 0;
            const s = raw || "";

            while (pos < s.length) {
                if (runId !== playbackId) return;

                const clr = s.indexOf("[CLR]", pos);
                const dly = s.indexOf("[DLY:", pos);
                const img = s.indexOf("[IMG:", pos);

                let next = -1;
                let kind = null;
                if (clr !== -1) { next = clr; kind = "clr"; }
                if (dly !== -1 && (next === -1 || dly < next)) { next = dly; kind = "dly"; }
                if (img !== -1 && (next === -1 || img < next)) { next = img; kind = "img"; }

                if (next === -1) {
                    appendText(s.slice(pos));
                    break;
                }

                if (next > pos) appendText(s.slice(pos, next));

                if (kind === "clr") {
                    outputEl.innerHTML = "";
                    pos = next + 5;
                } else if (kind === "dly") {
                    const end = s.indexOf("]", next);
                    if (end === -1) { appendText(s.slice(next)); break; }
                    const ms = parseInt(s.slice(next + 5, end), 10) || 0;
                    pos = end + 1;
                    if (ms > 0) await sleep(Math.min(ms, 5000));
                } else if (kind === "img") {
                    const end = s.indexOf("]", next);
                    if (end === -1) { appendText(s.slice(next)); break; }
                    const payload = s.slice(next + 5, end);
                    appendImage(payload);
                    pos = end + 1;
                }
            }
        }

        async function runCode() {
            if (!window.Module || typeof window.Module.ccall !== "function") {
                appendText("WASM runtime is not ready yet.\n", "err");
                return;
            }

            const code = window.editor.getValue();
            const timingEl = document.getElementById("timing");
            const outputEl = document.getElementById("output");

            playbackId++;
            const runId = playbackId;
            setRunning(true);
            setStatus("warn", "Running");
            outputEl.innerHTML = "";
            appendText("> Executing…\n", "meta");
            timingEl.textContent = "";

            const t0 = performance.now();
            let raw = "";

            try {
                // Suppress progressive event spam; we play the marker stream ourselves.
                raw = window.Module.ccall(
                    "mf_run_script_tier",
                    "string",
                    ["string", "number"],
                    [code, 0]
                ) || "";
            } catch (err) {
                appendText("\n[ERROR] " + (err && err.message ? err.message : String(err)) + "\n", "err");
                setStatus("err", "Error");
                setRunning(false);
                return;
            }

            const elapsed = ((performance.now() - t0) / 1000).toFixed(3);
            timingEl.textContent = elapsed + "s";

            // Drop the provisional line, then play markers (clear / delay / images)
            if (runId === playbackId) {
                outputEl.innerHTML = "";
                await playMarkedOutput(raw, runId);
            }

            if (runId === playbackId) {
                setRunning(false);
                setStatus("ok", "Ready");
            }
        }

        function copyCode() {
            const btn = document.getElementById("btnCopy");
            navigator.clipboard.writeText(window.editor.getValue()).then(() => {
                const orig = btn.textContent;
                btn.textContent = "Copied";
                setTimeout(() => { btn.textContent = orig; }, 1500);
            }).catch(() => {
                // fallback
                window.editor.execCommand("selectAll");
            });
        }

        window.addEventListener("resize", () => {
            if (window.editor) window.editor.refresh();
            if (!window.matchMedia("(max-width: 900px)").matches) {
                document.body.classList.remove("sidebar-open");
            }
        });
    </script>
    <!-- Cache-bust so GitHub Pages / CDNs pick up new builds after push -->
    <script src="manifast.js?v=0.0.13-c5f5"></script>
    <script>
        (function () {
            // Resolve wasm next to this page (works for /Manifast/ on GitHub Pages)
            const pageBase = new URL(".", window.location.href).href;
            const asset = (name) => new URL(name, pageBase).href;

            if (typeof ManifastModule !== "function") {
                setStatus("err", "Load failed");
                const p = document.querySelector("#loader p");
                if (p) {
                    p.textContent = "manifast.js did not define ManifastModule. Hard-refresh (Ctrl+F5) or clear cache.";
                    p.style.color = "var(--error)";
                }
                return;
            }

            ManifastModule({
                print: (t) => console.log("[MF]", t),
                printErr: (t) => console.warn("[MF err]", t),
                // Critical: do NOT strip the directory — GitHub Pages serves under /Manifast/
                locateFile: (path, prefix) => {
                    if (prefix) return prefix + path;
                    return asset(path.split("/").pop());
                }
            }).then(function (Module) {
                window.Module = Module;
                setStatus("ok", "Ready");
                document.getElementById("btnRun").disabled = false;

                const loader = document.getElementById("loader");
                if (loader) {
                    loader.style.opacity = "0";
                    setTimeout(() => loader.remove(), 400);
                }

                try {
                    if (Module.addFunction && Module._mf_set_event_callback) {
                        const cb = Module.addFunction(function () { /* playback uses return string */ }, "vii");
                        Module._mf_set_event_callback(cb);
                    }
                } catch (e) {
                    console.warn("event callback optional", e);
                }

                loadCustom();
                initSidebar();
                selectExample("fib");
                function syncMenuBtn() {
                    const btn = document.getElementById("btnMenu");
                    if (btn) {
                        btn.style.display =
                            window.matchMedia("(max-width: 900px)").matches ? "inline-flex" : "none";
                    }
                }
                syncMenuBtn();
                window.addEventListener("resize", syncMenuBtn);
                if (window.editor) window.editor.refresh();
            }).catch(function (err) {
                console.error(err);
                setStatus("err", "Load failed");
                const p = document.querySelector("#loader p");
                if (p) {
                    p.textContent = "Failed to load WASM: " + (err && err.message ? err.message : err)
                        + " — try hard-refresh (Ctrl+F5).";
                    p.style.color = "var(--error)";
                }
            });
        })();
    </script>
